<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#111111">

    <title>Login — Novel RINU'XANT</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <main class="login-page">


        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <section class="login-card">


            <!-- =================================================
                 LOGO
            ================================================== -->

            <div class="logo-container">

                <img src="assets/logo.svg"
                     class="logo"
                     alt="Novel RINU'XANT">

            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <div class="login-header">

                <h1>
                    Novel RINU'XANT
                </h1>

                <p>
                    Silakan masuk untuk membaca novel
                </p>

            </div>


            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div id="loginMessage"
                 class="login-message"
                 aria-live="polite">
            </div>


            <!-- =================================================
                 FORM
            ================================================== -->

            <form id="loginForm"
                  autocomplete="on">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        inputmode="tel"
                        autocomplete="username"
                        placeholder="Masukkan username"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Masukkan password"
                            required>


                        <button
                            id="togglePassword"
                            class="password-toggle"
                            type="button"
                            aria-label="Tampilkan password">

                            <span id="eyeIcon">
                                👁
                            </span>

                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">


                    <label class="remember-label">

                        <input
                            id="remember"
                            name="remember"
                            type="checkbox">

                        <span>
                            Ingat saya
                        </span>

                    </label>


                    <button
                        id="forgotPassword"
                        class="forgot-button"
                        type="button">

                        Lupa password?

                    </button>


                </div>


                <!-- =================================================
                     LOGIN BUTTON
                ================================================== -->

                <button
                    id="loginButton"
                    class="login-button"
                    type="submit">


                    <span id="loginButtonText">
                        Masuk
                    </span>


                    <span id="loginLoading"
                          class="login-loading"
                          hidden>

                        <span class="spinner"></span>

                        <span>
                            Memproses
                        </span>

                    </span>


                </button>


            </form>


            <!-- =================================================
                 REGISTER
            ================================================== -->

            <div class="register-area">

                <span>
                    Belum mempunyai akun?
                </span>


                <button
                    id="registerLink"
                    class="register-button"
                    type="button">

                    Daftar Sekarang

                </button>

            </div>


            <!-- =================================================
                 FOOTER
            ================================================== -->

            <div class="login-footer">

                <span>
                    ©
                </span>

                <span id="year">
                    2026
                </span>

                <span>
                    Novel RINU'XANT
                </span>

            </div>


        </section>


    </main>


    <script src="login.js"></script>

</body>

</html>
