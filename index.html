<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Novel Reader</title>

    <meta
        name="description"
        content="Login ke Novel Reader"
    >

    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">

                <div class="brand-logo">
                    <img src="assets/logo.svg" alt="Novel Reader">
                </div>

                <h1>Novel Reader</h1>

                <p>
                    Masuk untuk melanjutkan membaca
                </p>

            </div>


            <form
                id="loginForm"
                class="login-form"
                autocomplete="on"
            >

                <!-- USERNAME -->
                <div class="form-group">

                    <label for="username">
                        Username atau Email
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username atau email"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Tampilkan password"
                        >
                            <span id="eyeIcon">👁</span>
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->
                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                        >

                        <span>
                            Ingat saya
                        </span>

                    </label>


                    <a
                        href="https://wa.me/6285722207569?text=saya%20lupa%20password."
                        id="forgotPassword"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Lupa password?
                    </a>

                </div>


                <!-- LOGIN MESSAGE -->
                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <!-- TAMPIL SAAT BELUM DIKLIK -->
                    <span id="loginButtonText">
                        Masuk
                    </span>


                    <!-- TERSEMBUNYI SAAT AWAL -->
                    <span
                        id="loginLoading"
                        class="loading"
                        hidden
                    >
                        Memproses...
                    </span>

                </button>

            </form>


            <!-- DIVIDER -->
            <div class="divider">

                <span>
                    atau
                </span>

            </div>


            <!-- REGISTER -->
            <div class="register-area">

                <p>

                    Belum memiliki akun?

                    <a
                        href="https://wa.me/6285722207569?text=Halo%2C%20saya%20ingin%20membeli%20Novel."
                        id="registerLink"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Daftar sekarang
                    </a>

                </p>

            </div>


            <!-- FOOTER -->
            <footer class="login-footer">

                <span>

                    ©
                    <span id="year"></span>
                    Novel Reader

                </span>

            </footer>

        </section>

    </main>


    <!-- JAVASCRIPT LOGIN -->
    <script src="js/login.js"></script>


    <!-- JAVASCRIPT TOMBOL LOGIN -->
    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const loginButtonText =
            document.getElementById("loginButtonText");

        const loginLoading =
            document.getElementById("loginLoading");


        /*
         * Saat form LOGIN dikirim
         */
        loginForm.addEventListener("submit", function () {

            /*
             * Sembunyikan tulisan "Masuk"
             */
            loginButtonText.hidden = true;


            /*
             * Tampilkan "Memproses..."
             */
            loginLoading.hidden = false;


            /*
             * Nonaktifkan tombol
             * agar tidak diklik berkali-kali
             */
            loginButton.disabled = true;

        });

    </script>

</body>
</html>
